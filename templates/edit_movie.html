{% extends 'base.html' %} {% block content %}
<h2>Chỉnh sửa phim</h2>
<form method="POST" enctype="multipart/form-data">
  <div class="mb-3">
    <label for="title" class="form-label">Tên phim</label>
    <input
      type="text"
      class="form-control"
      id="title"
      name="title"
      value="{{ movie.title }}"
      required
    />
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Mô tả</label>
    <textarea class="form-control" id="description" name="description" rows="4">
{{ movie.description }}</textarea
    >
  </div>
  <div class="mb-3">
    <label for="rating" class="form-label">Số sao đánh giá (1-5)</label>
    <input
      type="number"
      class="form-control"
      id="rating"
      name="rating"
      min="1"
      max="5"
      value="{{ movie.rating }}"
      required
    />
  </div>
  <div class="mb-3">
    <label for="image" class="form-label"
      >Ảnh phim (115x175, để trống nếu không đổi)</label
    >
    <input
      type="file"
      class="form-control"
      id="image"
      name="image"
      accept="image/*"
    />
    <img
      src="{{ url_for('static', filename=movie.image_path) }}"
      alt="Current image"
      width="115"
      height="175"
      class="mt-2"
    />
  </div>
  <div class="mb-3">
    <label for="movie_url" class="form-label">Link phim</label>
    <input
      type="url"
      class="form-control"
      id="movie_url"
      name="movie_url"
      value="{{ movie.movie_url }}"
      required
    />
  </div>
  <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
  <a href="{{ url_for('index') }}" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}
