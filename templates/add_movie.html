{% extends 'base.html' %} {% block content %}
<h2>Thêm phim mới</h2>
<form method="POST" enctype="multipart/form-data">
  <div class="mb-3">
    <label for="title" class="form-label">Tên phim</label>
    <input type="text" class="form-control" id="title" name="title" required />
  </div>
  <div class="mb-3">
    <label for="description" class="form-label">Mô tả</label>
    <textarea
      class="form-control"
      id="description"
      name="description"
      rows="4"
    ></textarea>
  </div>
  <div class="mb-3">
    <label for="rating" class="form-label">Số sao đánh giá (1-5)</label>
    <input
      type="number"
      class="form-control"
      id="rating"
      name="rating"
      min="1"
      max="5"
      required
    />
  </div>
  <div class="mb-3">
    <label for="image" class="form-label">Ảnh phim (115x175)</label>
    <input
      type="file"
      class="form-control"
      id="image"
      name="image"
      accept="image/*"
      required
    />
  </div>
  <div class="mb-3">
    <label for="movie_url" class="form-label">Link phim</label>
    <input
      type="url"
      class="form-control"
      id="movie_url"
      name="movie_url"
      required
    />
  </div>
  <button type="submit" class="btn btn-primary">Thêm phim</button>
  <a href="{{ url_for('index') }}" class="btn btn-secondary">Hủy</a>
</form>
{% endblock %}
